[package]
name = "money-tracker"
version = "0.1.0"
edition = "2021"

[dependencies]
money_core = { path = "../money_core" }
clap = { version = "4", features = ["derive"] }
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
tabled = "0.16"
chrono = "0.4"

[dev-dependencies]
# MemoryBackend, so concept/account resolution can be tested offline.
money_core = { path = "../money_core", features = ["test-support"] }
